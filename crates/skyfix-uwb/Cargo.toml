[package]
name = "skyfix-uwb"
description = "Hardware-agnostic UWB ranging adapter for skyfix (DW3000-compatible)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["uwb", "ranging", "dw3000", "skyfix"]
categories = ["embedded", "no-std"]
readme = "README.md"
# Public crate once the dw3000-ng integration (Phase 7b) lands and validates.
publish = false

[features]
# Default to std for convenience on host targets — embedded users opt into
# `libm` explicitly with `--no-default-features --features libm`.
default = ["std"]
std = ["skyfix-core/std"]
libm = ["skyfix-core/libm"]

[dependencies]
skyfix-core = { path = "../skyfix-core", version = "=0.1.0-alpha.0", default-features = false }
nalgebra = { workspace = true }

[dev-dependencies]
approx = { workspace = true }
nalgebra = { workspace = true, features = ["std"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
