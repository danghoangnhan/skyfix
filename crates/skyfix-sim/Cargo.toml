[package]
name = "skyfix-sim"
description = "Desktop simulator and CSV replay tool for skyfix UAV localization algorithms"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "skyfix-sim"
path = "src/main.rs"

[dependencies]
skyfix-core = { path = "../skyfix-core", features = ["std", "alloc"] }
nalgebra = { workspace = true, features = ["std"] }
rand = "0.9"
rand_chacha = "0.9"
rand_distr = "0.5"
