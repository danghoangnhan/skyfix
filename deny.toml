[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# When advisories arrive that we've evaluated and accepted, list them here
# with an inline comment justifying the exception.
ignore = [
    # paste 1.0.15 is unmaintained but pulled in only transitively through
    # simba → nalgebra. There is no safe upgrade. Track upstream nalgebra
    # for a replacement; revisit when a paste-free simba release lands.
    { id = "RUSTSEC-2024-0436", reason = "transitive via simba/nalgebra; no upgrade path until upstream replaces paste" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
allow = []
# Known incompatible / abandoned / vulnerable crates would go here.
deny = []
# When dep trees legitimately need two versions of the same crate (common
# during ecosystem transitions like rand 0.8 ↔ 0.9), list them here.
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
