name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [fmt, clippy, build, test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.task }}
      - name: Run ${{ matrix.task }}
        run: |
          # skyfix-cuda excluded here because GitHub Actions ubuntu-latest
          # ships no CUDA toolkit. A dedicated cuda.yml workflow uses
          # Jimver/cuda-toolkit to build skyfix-cuda separately.
          case "${{ matrix.task }}" in
            fmt)    cargo fmt --all --check ;;
            clippy) cargo clippy --workspace --exclude skyfix-cuda --all-targets -- -Dwarnings ;;
            build)  cargo build --workspace --exclude skyfix-cuda ;;
            test)   cargo test --workspace --exclude skyfix-cuda ;;
          esac

  embedded:
    name: embedded (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - thumbv7em-none-eabihf
          - thumbv8m.main-none-eabihf
          - riscv32imac-unknown-none-elf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: embed-${{ matrix.target }}
      - run: cargo build -p skyfix-core --no-default-features --features libm --target ${{ matrix.target }}

  no-cuda-leak:
    # Guard against CUDA dependencies sneaking into the embedded build path.
    # The skyfix-cuda crate must stay a *separate* workspace member; if anyone
    # adds a `cuda` feature to skyfix-core that pulls cudarc in transitively,
    # this job catches it before merge.
    name: no-cuda-leak (Cortex-M dep graph)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
        with:
          key: no-cuda-leak
      - name: Inspect skyfix-core embedded dep graph
        run: |
          tree=$(cargo tree -p skyfix-core --target thumbv7em-none-eabihf --no-default-features --features libm 2>&1)
          echo "$tree"
          if echo "$tree" | grep -iE 'cuda|cudarc|libloading|nvrtc'; then
            echo "::error::CUDA-related crate leaked into skyfix-core embedded build"
            exit 1
          fi

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.88"
