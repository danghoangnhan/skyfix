name: Release

# Triggered when a `v*.*.*` tag is pushed. Publishes the publishable
# workspace crates to crates.io via Trusted Publishing (OIDC, no
# long-lived API tokens). The corresponding crates.io configuration step
# must be done once per crate at https://crates.io/me/tokens — set up a
# "Trusted Publisher" entry pointing at this repo and workflow filename.
#
# Only `skyfix-core` is currently publishable; the rest of the workspace
# is `publish = false` until they stabilize (Phase 7 driver crates,
# Phase 5 sim/examples, Phase 6 CUDA).

on:
  push:
    tags:
      - 'v*.*.*'

# Required for crates.io Trusted Publishing OIDC.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Verify version matches tag
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          crate_version=$(cargo metadata --format-version 1 --no-deps | \
            python3 -c "import json,sys; m=json.load(sys.stdin); print(next(p['version'] for p in m['packages'] if p['name']=='skyfix-core'))")
          if [ "$tag" != "$crate_version" ]; then
            echo "::error::tag v$tag does not match skyfix-core version $crate_version"
            exit 1
          fi
      - name: Publish skyfix-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p skyfix-core
