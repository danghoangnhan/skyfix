[book]
title = "The skyfix Book"
description = "A practical guide to Rust UAV localization & triangulation for the edge."
authors = ["Daniel <daniel@thinktronltd.com>"]
language = "en"
multilingual = false
src = "src"

[build]
build-dir = "build"
create-missing = false

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/danghoangnhan/skyfix"
edit-url-template = "https://github.com/danghoangnhan/skyfix/edit/main/book/{path}"
no-section-label = false
mathjax-support = true
git-repository-icon = "fa-github"

[output.html.fold]
enable = true
level = 1
